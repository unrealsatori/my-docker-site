services:
  web:
    build: .
    ports:
      - "8080:80"
    networks:
      - app-net

  api:
    image: kennethreitz/httpbin
    networks:
      - app-net

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-net

networks:
  app-net:

volumes:
  db-data:
